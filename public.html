<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LTs Workshop Queue</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1d212b;--line:#272c38;--text:#e8ebf2;
    --muted:#8b93a7;--pri:#ffb020;--pri-bg:#3a2c0c;--done:#25c26e;--hi:#4f8cff}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;background:linear-gradient(180deg,#141824,#0f1115);
    border-bottom:1px solid var(--line);padding:16px 20px;text-align:center}
  header h1{font-size:18px;margin:0}
  header .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .dot{width:8px;height:8px;border-radius:50%;background:#ff5d5d;display:inline-block;margin-right:6px;box-shadow:0 0 7px rgba(255,93,93,.6)}
  .dot.live{background:var(--done);box-shadow:0 0 8px var(--done)}
  main{max-width:560px;margin:0 auto;padding:16px 14px 80px}
  .find{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:11px 14px;border-radius:10px;font-size:14px;margin-bottom:16px}
  .row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
    border-radius:11px;padding:12px 14px;margin-bottom:8px;animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .row.priority{border-color:var(--pri);background:linear-gradient(90deg,var(--pri-bg),var(--panel))}
  .row.me{outline:2px solid var(--hi);box-shadow:0 0 14px rgba(79,140,255,.35)}
  .pos{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;width:40px;text-align:center;color:var(--muted)}
  .row.priority .pos{color:var(--pri)}
  .name{font-weight:700;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--pri);color:#2a1e00}
  .count{margin-left:auto;font-size:12px;color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:48px 20px;border:1px dashed var(--line);border-radius:12px}
  .note{font-size:11px;color:var(--muted);text-align:center;margin-top:18px}
  .brand{text-align:center;color:var(--muted);font-size:14px;letter-spacing:.2px;padding:18px 20px 32px;
    border-top:1px solid var(--line);margin-top:10px;opacity:.95}
  .brand b{color:var(--text);font-weight:700}
  .brand a{color:inherit;text-decoration:none}
  .brand a:hover b{color:var(--hi);text-decoration:underline}
  /* LTs Box Tracker — lives IN the header. On wide screens it pins to the
     right of the header while the title stays centered; on narrower screens it
     drops just below the title, still inside the header (so it sits above the
     queue on phones). */
  #variants{margin-top:8px;width:100%}
  .tally{display:flex;flex-direction:column;align-items:center;gap:8px}
  .tally h2{font-size:12px;margin:0;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;text-align:center}
  .tally .grid{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
  .vchip{display:flex;align-items:baseline;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 12px}
  .vchip .vl{font-size:13px;color:var(--muted);white-space:nowrap}
  .vchip .vn{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--pri)}
  /* Open breaks — compact card, progress bar, collapsible numbered list. */
  .brks{margin:0 0 6px}
  .brkcard{background:var(--panel);border:1px solid #4b3a7a;border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .brkcard .bt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .brkcard .bt b{font-size:14.5px;line-height:1.25}
  .brkcard .rp{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;background:#3b2d6b;color:#d9ccff;border-radius:20px;padding:2px 8px;white-space:nowrap}
  .brkcard .bar{height:7px;border-radius:6px;background:var(--panel2);overflow:hidden;margin:10px 0 6px}
  .brkcard .bar i{display:block;height:100%;background:linear-gradient(90deg,#7c63d6,#c9b8ff);border-radius:6px}
  .brkcard .bs{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px}
  .brkcard .bs b{color:var(--text)}
  .brkcard .bmine{margin-top:8px;font-size:12.5px;color:#e2d8ff;background:rgba(124,99,214,.16);border:1px solid #7c63d6;border-radius:8px;padding:6px 10px}
  .brkcard details{margin-top:8px}
  .brkcard summary{cursor:pointer;color:#c9b8ff;font-size:12.5px;font-weight:700;list-style:none;user-select:none}
  .brkcard summary::-webkit-details-marker{display:none}
  .brkcard summary::before{content:'▸ ';color:var(--muted)}
  .brkcard details[open] summary::before{content:'▾ '}
  .brkcard .brd{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
  .brkcard ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:2px 14px}
  .brkcard li{display:flex;gap:7px;align-items:baseline;font-size:12.5px;padding:3px 0;border-bottom:1px solid var(--line);min-width:0}
  .brkcard li .sn{color:var(--muted);font-variant-numeric:tabular-nums;min-width:30px;text-align:right;font-size:11.5px}
  .brkcard li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brkcard li.me{color:#e2d8ff;font-weight:700}
  .brkcard li.me .sn{color:#c9b8ff}
  .qhead{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:16px 4px 8px}
</style>
</head>
<body>
<header>
  <h1><span id="dot" class="dot"></span>LTs Workshop Queue</h1>
  <div class="sub" id="sub">Waiting for the live to start…</div>
  <div id="variants"></div>
</header>
<main>
  <input id="find" class="find" placeholder="Type your username to highlight your spot…" oninput="render()" />
  <div id="breaks" class="brks"></div>
  <div id="list"></div>
  <div class="note">Order totals and personal details are private and never shown here.</div>
</main>
<footer class="brand">Queue built by <a href="https://www.tiktok.com/@palmbeachcardco" target="_blank" rel="noopener noreferrer"><b>Palm Beach Card Co</b></a> (Zach Rips)</footer>
<script>
  // Live-feed connection with explicit, never-give-up reconnection so the public
  // board can't get stuck on stale data if the feed drops (tab backgrounded,
  // phone asleep, wifi blip, instance recycle). The server re-sends the full
  // state on every (re)connect, so a reconnect is all we need to resync.
  const socket = io('/public', {
    reconnection: true,
    reconnectionAttempts: Infinity,
    reconnectionDelay: 500,
    reconnectionDelayMax: 5000,
    timeout: 20000,
  });
  let state = { queue: [], stats: {} };
  socket.on('state', (s) => { state = s; render(); });
  // Force an immediate reconnect when the viewer returns to the tab or the
  // network comes back, instead of waiting on throttled backoff timers.
  function kick(){ try{ if(!socket.connected) socket.connect(); }catch(e){} }
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') kick(); });
  window.addEventListener('online', kick);
  window.addEventListener('focus', kick);

  function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  function renderVariants(){
    const box = document.getElementById('variants');
    const vs = state.variants || [];
    if(!vs.length){ box.innerHTML = ''; return; }
    box.innerHTML = `<div class="tally"><h2>LTs Box Tracker</h2><div class="grid">${
      vs.map(v=>`<div class="vchip"><span class="vl">${esc(v.label)}</span><span class="vn">${Number(v.count)||0}</span></div>`).join('')
    }</div></div>`;
  }

  const openBreaks = new Set(); // which "See who's in" lists the viewer opened
  function brkToggle(id, open){ if(open) openBreaks.add(id); else openBreaks.delete(id); }
  function renderBreaks(me){
    const box = document.getElementById('breaks');
    const bs = (state.live !== false) ? (state.breaks || []) : [];
    if(!bs.length){ box.innerHTML = ''; return; }
    box.innerHTML = bs.map(b=>{
      const title = String(b.title||'Break').replace(/\s*\(\d+\s*-?\s*spots?\)\s*/i,' ').trim();
      const es = b.entries || [];
      const cap = b.capacity || 0;
      const taken = Number(b.spots)||0;
      const pct = cap ? Math.min(100, Math.round(taken / cap * 100)) : 0;
      const isMe = (e)=> me && String(e.buyer||'').toLowerCase().includes(me);
      const rng = (e)=> '#'+(e.spot||'?')+((e.qty>1 && e.spot)?'–'+(e.spot+e.qty-1):'');
      const mine = es.filter(isMe);
      const mineSpots = mine.reduce((n,e)=>n+(e.qty||1),0);
      // Group the waiting spots by round (only when the break has a set size).
      const groups = new Map();
      for(const e of es){ const r = cap ? (e.round||1) : 0; if(!groups.has(r)) groups.set(r, []); groups.get(r).push(e); }
      const list = [...groups.entries()].map(([r, g])=>
        (cap && groups.size>1 ? `<div class="brd">Round ${r}</div>` : '')
        + `<ol>${g.map(e=>`<li class="${isMe(e)?'me':''}"><span class="sn">${rng(e)}</span><span class="nm">${esc(e.buyer)}</span></li>`).join('')}</ol>`
      ).join('');
      const waiting = es.reduce((n,e)=>n+(e.qty||1),0);
      const open = openBreaks.has(b.id) || mine.length > 0;
      return `<div class="brkcard">
        <div class="bt"><b>🎟 ${esc(title)}</b>${cap && b.round ? `<span class="rp">Round ${b.round}</span>` : ''}</div>
        ${cap ? `<div class="bar"><i style="width:${pct}%"></i></div>
        <div class="bs"><span><b>${taken} / ${cap}</b> spots taken</span><span>${taken>=cap?'Full — next spot starts a new round':(cap-taken)+' left this round'}</span></div>`
        : `<div class="bs" style="margin-top:6px"><span><b>${waiting}</b> spot${waiting===1?'':'s'} waiting to be ripped</span></div>`}
        ${mine.length ? `<div class="bmine">You have ${mineSpots} spot${mineSpots===1?'':'s'}: ${mine.map(e=>(cap&&e.round?'R'+e.round+' ':'')+rng(e)).join(', ')}</div>` : ''}
        ${es.length ? `<details ${open?'open':''} ontoggle="brkToggle('${b.id}', this.open)"><summary>See who's in · ${waiting} spot${waiting===1?'':'s'} waiting</summary>${list}</details>` : ''}
      </div>`;
    }).join('') + '<div class="qhead">Live queue</div>';
  }

  function render(){
    const q = state.queue || [];
    renderBreaks((document.getElementById('find').value || '').toLowerCase());
    const st = state.stats || {};
    const live = state.live !== false; // treat missing as live for safety
    document.getElementById('dot').classList.toggle('live', live); // green = live, red = offline
    const findBox = document.getElementById('find');
    const el = document.getElementById('list');
    renderVariants();

    if(!live){
      document.getElementById('sub').textContent = 'Offline — no live running right now';
      findBox.style.display = 'none';
      el.innerHTML = '<div class="empty">🔴 The live isn\'t running right now, so the queue is closed.<br><br>Check back during the next live!</div>';
      return;
    }
    findBox.style.display = '';
    document.getElementById('sub').textContent = q.length
      ? `${st.activeCount} in line${st.priorityCount ? ` · ${st.priorityCount} priority` : ''}`
      : 'Queue is empty right now.';
    const me = (findBox.value || '').toLowerCase();
    if(!q.length){ el.innerHTML = '<div class="empty">No orders in the queue yet.</div>'; return; }
    el.innerHTML = q.map(e=>{
      const mine = me && e.buyer.toLowerCase().includes(me);
      const cls = 'row'+(e.isPriority?' priority':'')+(mine?' me':'');
      return `<div class="${cls}">
        <div class="pos">${e.position}</div>
        <div class="name">${esc(e.buyer)}</div>
        ${e.isPriority?'<span class="tag">PRIORITY</span>':''}
      </div>`;
    }).join('');
  }
  render();
</script>
</body>
</html>
