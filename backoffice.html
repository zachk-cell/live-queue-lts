<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Back office — LTs Workshop Queue</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --line:#272c38; --grid:#232836;
    --text:#e8ebf2; --text2:#9aa3b8; --accent:#4f8cff; --accent2:#2b6bff;
    --good:#25c26e; --bad:#ff5d5d; --warn:#ffb020;
    --s1:#338ced; --s2:#e76624; --cons:#9887ef;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#141824,#0f1115);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  header h1{font-size:16px;margin:0 10px 0 0}
  a{color:#9cc2ff}
  .hl{color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13px;font-weight:600}
  .hl:hover{border-color:var(--accent)}
  .tabs{display:flex;gap:4px;flex-wrap:wrap}
  .tab{background:transparent;border:1px solid transparent;color:var(--text2);border-radius:9px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer}
  .tab.on{background:var(--panel2);border-color:var(--line);color:var(--text)}
  .sp{flex:1}
  main{max-width:1280px;margin:0 auto;padding:18px 16px 90px}
  button{cursor:pointer;border-radius:9px;font-size:13px;font-weight:600;padding:8px 13px;background:var(--panel2);color:var(--text);border:1px solid var(--line);font-family:inherit}
  button:hover{filter:brightness(1.15)}
  button.primary{background:var(--accent2);border-color:var(--accent2)}
  button.ghost{background:transparent}
  button.sm{padding:4px 8px;font-size:12px}
  button:disabled{opacity:.45;cursor:default}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .card h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .card h2 .sub{font-weight:500;color:var(--text2);font-size:12.5px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .muted{color:var(--text2)}.small{font-size:12px}
  .banner{border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:14px;line-height:1.45}
  .banner.warn{background:#2c2410;border:1px solid #6b5313;color:#ffd98a}
  .banner.info{background:#13213a;border:1px solid #2b4d8f;color:#bcd5ff}
  .banner.ok{background:#10281b;border:1px solid #1f6b40;color:#a6efc4}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text2);border-bottom:1px solid var(--line);padding:8px;white-space:nowrap;position:sticky;top:0;background:var(--panel)}
  td{padding:8px;border-bottom:1px solid #1f2430;vertical-align:middle}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  tr:hover td{background:#1a1e27}
  .scroll{max-height:68vh;overflow:auto}
  .pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.4px;border-radius:20px;padding:2px 8px}
  .pill.cons{background:#2a2350;color:#cfc6ff}.pill.unc{background:#3a2c0c;color:#ffc861}.pill.low{background:#3a1717;color:#ffaaaa}
  .ed{display:inline-flex;align-items:center;gap:6px}
  .ed .pen{background:transparent;border:none;color:var(--text2);padding:2px 4px;font-size:13px}
  .ed .pen:hover{color:var(--accent)}
  .ed .pen:disabled{opacity:.3;cursor:not-allowed}
  .prichk{width:16px;height:16px;accent-color:#ffb020;cursor:pointer}
  .ed input{width:90px;padding:4px 6px}
  .kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--text2);font-weight:700}
  .kpi .v{font-size:22px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:11.5px;color:var(--text2);margin-top:2px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  /* charts */
  .chart{position:relative}
  .bars{display:flex;align-items:flex-end;gap:4px;height:170px;border-bottom:1px solid var(--text2);padding:0 2px;background:repeating-linear-gradient(to top,transparent 0,transparent 41px,var(--grid) 41px,var(--grid) 42px)}
  .bars .g{flex:1;display:flex;align-items:flex-end;gap:2px;height:100%}
  .bars .b{flex:1;border-radius:4px 4px 0 0;min-height:2px;background:var(--s1)}
  .bars .b.s2{background:var(--s2)}
  .bars .b:hover{filter:brightness(1.2)}
  .xl{display:flex;gap:4px;padding:5px 2px 0}.xl span{flex:1;text-align:center;font-size:10.5px;color:var(--text2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--text2);margin-bottom:8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .heat{display:grid;grid-template-columns:38px repeat(24,1fr);gap:2px;font-size:10px;color:var(--text2)}
  .heat .c{height:20px;border-radius:3px;background:#1b2130}
  .heat .c:hover{outline:1px solid #fff}
  .heat .lab{display:flex;align-items:center}
  .tip{position:fixed;pointer-events:none;background:#05070b;border:1px solid var(--line);color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;display:none;z-index:99;white-space:nowrap}
  .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .filters label{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px}
  th.sortable{cursor:pointer;user-select:none} th.sortable:hover,th.sortable.on{color:var(--text)} th .sarrow{opacity:.45}
  tr.grp td{cursor:pointer;background:var(--panel2);font-size:13px;padding:9px 10px;border-top:1px solid var(--line)} tr.grp:hover td{color:var(--text)} tr.grp .caret{display:inline-block;width:12px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:none;border-radius:0;background:transparent;color:var(--text2);padding:6px 10px}
  .seg button.on{background:var(--panel2);color:var(--text)}
  /* lock screen */
  .lock{max-width:380px;margin:80px auto;text-align:center}
  .lock .card{padding:26px 24px}
  .lock h2{justify-content:center;font-size:18px}
  .lock input{width:100%;margin:6px 0 10px;padding:11px 12px;font-size:14px}
  .lock button{width:100%;padding:11px}
  .err{color:#ff9b9b;font-size:12.5px;min-height:18px}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
  .modal.open{display:flex}
  .modal .card{width:min(460px,92vw);margin:0}
  .modal label{display:block;font-size:12px;color:var(--text2);margin:10px 0 4px}
  .modal input,.modal select,.modal textarea{width:100%}
  .modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  @media (max-width:980px){ .kpis{grid-template-columns:repeat(3,1fr)} .grid2,.grid3{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <h1>🔒 Back office</h1>
  <a class="hl" href="{{ADMIN}}">← Queue</a>
  <div class="tabs" id="tabs" style="display:none">
    <a class="tab" href="{{ADMIN}}/reports" style="text-decoration:none" title="After-action reports for every stream (sales, revenue, TikTok actuals)">📋 Reports</a>
    <button class="tab" data-t="inv">📦 Inventory & pricing</button>
    <button class="tab" data-t="profit">💵 Profit & exports</button>
    <button class="tab" data-t="metrics">📈 Sales metrics</button>
    <button class="tab" data-t="log">🧾 Changelog</button>
    <button class="tab" data-t="settings">⚙ Settings</button>
  </div>
  <span class="sp"></span>
  <button class="ghost" id="lockBtn" style="display:none" onclick="lockNow()">🔒 Lock</button>
</header>
<main id="main"><div class="muted">Loading…</div></main>

<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>
<div class="tip" id="tip"></div>

<script type="module">
import { buildFacts, aggregate, termsFromMap, itemKey, bandOf, PRICE_BANDS, bandLabel, tzParts, actuals } from '/static/analytics.js';

const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = (n)=>(Number(n)<0?'−':'')+'$'+Math.abs(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = (n)=>(Number(n)<0?'−':'')+'$'+Math.abs(Math.round(Number(n)||0)).toLocaleString('en-US');
const int = (n)=>Number(n||0).toLocaleString('en-US');
const pct = (n)=>(Math.round((Number(n)||0)*10)/10)+'%';
async function api(url, body){
  const r = await fetch(url, body===undefined ? {} : {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  let j = {}; try { j = await r.json(); } catch {}
  if(r.status===401 && j.error==='locked'){ showLock(); throw new Error('locked'); }
  return { ok: r.ok && j.ok !== false, status: r.status, ...j };
}

let D = null;          // /api/bo/data
let ORDERS = null;     // /api/bo/orders
let TAB = (location.hash||'#inv').slice(1);
const fmtD = (ms, o={month:'short',day:'numeric',year:'numeric'})=> ms ? new Intl.DateTimeFormat('en-US',{timeZone:(D&&D.settings.timezone)||'America/New_York',...o}).format(new Date(ms)) : '—';

// ───────────────────────── lock ─────────────────────────
async function boot(){
  const s = await (await fetch('/api/bo/status')).json().catch(()=>({}));
  if(!s.unlocked) return showLock(s.password);
  if(goBack()) return;
  await load();
}
// Came here from a locked report (?next=#…): once unlocked, go straight back to it.
function goBack(){
  const back = new URLSearchParams(location.search).get('next');
  if(back && /^#?[\w/%-]*$/.test(back)){ location.href = '{{ADMIN}}/reports' + (back.startsWith('#')?back:'#'+back); return true; }
  return false;
}
function showLock(pwState){
  $('tabs').style.display='none'; $('lockBtn').style.display='none';
  const setup = pwState === 'unset';
  $('main').innerHTML = `<div class="lock"><div class="card">
    <h2>🔒 ${setup?'Create the back-office password':'Back office is locked'}</h2>
    <p class="muted small">${setup
      ? 'This area (costs, consignment, profit, price & stock edits) has its own password, separate from the queue login. Choose one now — at least 8 characters. Only share it with the back-office team.'
      : 'Enter the back-office password. It\'s separate from the queue login.'}</p>
    <input type="password" id="pw" placeholder="${setup?'New password (8+ characters)':'Back-office password'}" autocomplete="${setup?'new-password':'current-password'}">
    ${setup?'<input type="password" id="pw2" placeholder="Type it again" autocomplete="new-password">':''}
    <div class="err" id="pwerr"></div>
    <button class="primary" id="pwgo">${setup?'Create & unlock':'Unlock'}</button></div></div>`;
  const go = async ()=>{
    const pw = $('pw').value;
    if(setup){ if(pw !== $('pw2').value){ $('pwerr').textContent='The two passwords don\'t match.'; return; } }
    const r = await api(setup?'/api/bo/setup':'/api/bo/login', {password: pw}).catch(e=>({ok:false,error:e.message}));
    if(!r.ok){ $('pwerr').textContent = r.error || 'Could not unlock.'; return; }
    if(goBack()) return;
    await load();
  };
  $('pwgo').onclick = go; $('pw').onkeydown = (e)=>{ if(e.key==='Enter') go(); };
  setTimeout(()=>$('pw').focus(), 50);
}
window.lockNow = async ()=>{ await fetch('/api/bo/lock',{method:'POST'}); showLock('set'); };

async function load(){
  D = await api('/api/bo/data');
  ORDERS = (await api('/api/bo/orders')).orders || [];
  $('tabs').style.display='flex'; $('lockBtn').style.display='';
  render();
}
document.querySelectorAll('.tab[data-t]').forEach(b=>b.onclick=()=>{ TAB=b.dataset.t; location.hash=TAB; render(); });
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.t===TAB));
  ({inv:renderInv, profit:renderProfit, metrics:renderMetrics, log:renderLog, settings:renderSettings}[TAB] || renderInv)();
  $('main').dataset.tab = TAB || 'inv';
}
const termsOf = (l)=>termsFromMap(D.items, l);

// ───────────────────────── modal helpers ─────────────────────────
function modal(html){ $('modalCard').innerHTML = html; $('modal').classList.add('open'); }
function closeModal(){ $('modal').classList.remove('open'); }
window.closeModal = closeModal;
$('modal').onclick = (e)=>{ if(e.target.id==='modal') closeModal(); };
function confirmBox(title, body, okText='Confirm'){
  return new Promise((res)=>{
    modal(`<h2>${esc(title)}</h2><p class="muted" style="font-size:13.5px;line-height:1.5">${body}</p><div class="acts"><button class="ghost" id="cNo">Cancel</button><button class="primary" id="cYes">${esc(okText)}</button></div>`);
    $('cNo').onclick=()=>{closeModal();res(false);}; $('cYes').onclick=()=>{closeModal();res(true);};
  });
}

// ───────────────────────── inventory ─────────────────────────
let invQ = '', invF = 'all', editing = null;
// Price / Stock column sort (click header: high → low, low → high, off) and the
// collapsed Deactivated / Deleted sections.
let invSort = { col: null, dir: -1 }, invOpen = { deact: false, del: false };
const invGroup = (r) => /DELETE/i.test(r.status || '') ? 'del' : /DEACTIVAT/i.test(r.status || '') ? 'deact' : 'main';
window.sortInv = (col) => {
  if (invSort.col !== col) invSort = { col, dir: -1 };
  else if (invSort.dir === -1) invSort.dir = 1;
  else invSort = { col: null, dir: -1 };
  renderInv();
};
window.toggleInvGroup = (g) => { invOpen[g] = !invOpen[g]; renderInv(); };
function invRows(){
  const sold = new Map(); // key -> {units, gross, first, last}
  for(const o of ORDERS){
    if(o.status==='cancelled') continue;
    for(const it of o.items){ if(it.cancelled) continue;
      for(const k of [itemKey(it), it.productId?'prod:'+it.productId:null].filter(Boolean)){
        const s = sold.get(k) || {units:0,gross:0,first:o.createdAt,last:o.createdAt};
        s.units += it.qty||1; s.gross += (Number(it.price)||0)*(it.qty||1);
        s.first=Math.min(s.first,o.createdAt); s.last=Math.max(s.last,o.createdAt); sold.set(k,s);
      }
    }
  }
  const rows = [];
  const cat = (D.catalog && D.catalog.products) || [];
  if(cat.length){
    for(const p of cat) for(const k of (p.skus||[])){
      const key = 'sku:'+k.id;
      const label = p.title + (k.name ? ' — '+k.name : '');
      rows.push({ key, prodKey:'prod:'+p.id, productId:p.id, skuId:k.id, label, sellerSku:k.sellerSku, status:p.status,
        price:k.price, stock:k.stock, wh:(k.warehouses||[]).length, listedAt:p.createdAt, s: sold.get(key) || {units:0,gross:0},
        t: termsFromMap(D.items, {skuId:k.id, productId:p.id, name:label}), live:true });
    }
  } else {
    for(const s of D.seen){
      rows.push({ key:s.key, prodKey: s.productId?'prod:'+s.productId:null, productId:s.productId, skuId:s.skuId, label:s.name, sellerSku:s.sku,
        price:s.lastPrice, stock:null, s:{units:s.units,gross:s.gross,first:s.firstSale,last:s.lastSale},
        t: termsFromMap(D.items, {skuId:s.skuId, productId:s.productId, name:s.name}), live:false });
    }
  }
  return rows;
}
function renderInv(){
  // Keep the user's place: re-rendering (after a ⭐/🎯 tick, an edit, a sort or
  // opening a section) must not jump the table or page back to the top.
  const prevSc = $('main').dataset.tab === 'inv' ? $('main').querySelector('.scroll') : null;
  const keepTop = prevSc ? prevSc.scrollTop : 0, keepY = window.scrollY;
  const cat = D.catalog || {};
  const synced = (cat.products||[]).length;
  const scopeMsg = cat.error && /scope|permission|unauthor|denied|not allowed|105005|36009004/i.test(cat.error);
  let banner = '';
  if(!synced) banner = `<div class="banner warn">📦 <b>Waiting for product access.</b> Live stock and prices need the TikTok <b>Product</b> permission. It's been added to the app — once the <b>LTs shop re-authorizes</b> the app, this fills in automatically (or hit ↻ Sync catalog). Until then you can already enter <b>costs</b> and <b>consignment</b> for every item that has sold (listed below) — they apply to past and future sales right away.${cat.error?`<br><span class="small" style="opacity:.8">Last sync: ${esc(cat.error)}</span>`:''}</div>`;
  else banner = `<div class="banner ok">📦 Catalog synced ${esc(fmtD(cat.syncedAt,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))} — ${int(synced)} products. Stock is re-synced every 6 hours (that history powers time-to-sell).${cat.error?`<br><span class="small">Latest sync failed: ${esc(cat.error)}</span>`:''}</div>`;
  const rows = invRows();
  const q = invQ.toLowerCase();
  const shown = rows.filter(r=>(!q || r.label.toLowerCase().includes(q) || String(r.sellerSku||'').toLowerCase().includes(q))
    && (invF==='all' || (invF==='pri' && r.t.priority) || (invF==='brk' && r.t.isBreak) || (invF==='cons' && r.t.consigned) || (invF==='unc' && !r.t.consigned && (r.t.cost==null||r.t.cost==='')) || (invF==='low' && r.stock!=null && r.stock<=2)));
  const nUnc = rows.filter(r=>!r.t.consigned && (r.t.cost==null||r.t.cost==='')).length;
  const s = D.settings;
  const unitNet = (r)=>{
    const p = Number(r.price)||0; if(!p) return null;
    const fees = p*(s.tiktokFeePct+s.streamerPct)/100;
    if(r.t.consigned){ const pay = r.t.splitType==='fixed' ? Number(r.t.splitValue)||0 : p*(Number(r.t.splitValue)||0)/100; return p-fees-pay; }
    if(r.t.cost==null || r.t.cost==='') return null;
    return p - fees - Number(r.t.cost);
  };
  const rowHtml = (r)=>{
      const nu = unitNet(r);
      return `<tr>
        <td style="text-align:center"><input type="checkbox" class="prichk" ${r.t.priority?'checked':''} title="Orders containing this item jump up the queue as PRIORITY" onchange="togglePri('${esc(r.key)}', this.checked)"></td>
        <td style="text-align:center"><input type="checkbox" class="prichk" ${r.t.isBreak?'checked':''} title="This listing is a break — its spots go to a break section, not the queue" onchange="toggleBrk('${esc(r.key)}', this.checked)"></td>
        <td><div style="font-weight:600">${esc(r.label)}</div><div class="small muted">${r.sellerSku?'SKU '+esc(r.sellerSku):''}${r.status&&r.status!=='ACTIVATE'?' · '+esc(r.status.toLowerCase()):''}</div></td>
        <td class="n">${editCell(r,'price')}</td>
        <td class="n">${editCell(r,'stock')}</td>
        <td class="n">${r.t.consigned?'<span class="muted small">n/a</span>':editCell(r,'cost')}</td>
        <td>${r.t.consigned?`<span class="pill cons">CONSIGNED</span> <span class="small">${esc(r.t.consignee||'—')} · ${r.t.splitType==='fixed'?money(r.t.splitValue)+'/unit':pct(r.t.splitValue)} to them</span>`:'<span class="muted small">own stock</span>'}
          <button class="sm ghost" onclick="editCons('${esc(r.key)}')">✎</button></td>
        <td class="n">${int(r.s.units)}</td><td class="n">${money0(r.s.gross)}</td>
        <td class="n">${nu==null?'<span class="pill unc" title="Enter a cost to see margin">—</span>':`<span style="color:${nu<0?'var(--bad)':'var(--text)'}">${money(nu)}</span>`}</td></tr>`;
    };
  $('main').innerHTML = banner + `<div class="card"><h2>Inventory & pricing <span class="sub">${synced?'live TikTok catalog':'items seen in sales'} · ${int(rows.length)} items</span></h2>
    <div class="row" style="margin-bottom:10px">
      <input id="invq" placeholder="Search item or SKU…" value="${esc(invQ)}" style="flex:1;min-width:200px">
      <div class="seg" id="invf">${[['all','All'],['pri','⭐ Priority ('+rows.filter(r=>r.t.priority).length+')'],['brk','🎯 Breaks ('+rows.filter(r=>r.t.isBreak).length+')'],['unc','No cost yet ('+nUnc+')'],['cons','Consigned'],['low','Low stock']].map(([k,l])=>`<button data-f="${k}" class="${invF===k?'on':''}">${l}</button>`).join('')}</div>
      <button onclick="syncCatalog()" title="Pull products, prices and stock from TikTok">↻ Sync catalog</button>
    </div>

function invBody(shown, rowHtml){

}

function rangeMs(){
  const now = Date.now(), day=86400000;
  const tz = D.settings.timezone;
  const startOf = (unit)=>{ // local midnight (store time zone) of today / week / month / quarter / year
    const p = tzParts(now, tz);
    const d = new Date(now);
    const wallNow = Date.UTC(p.year, p.month-1, p.day, p.hour, d.getUTCMinutes(), d.getUTCSeconds(), d.getUTCMilliseconds());
    const offset = wallNow - now; // store wall clock minus UTC
    const ms = (y,m,day)=> Date.UTC(y,m,day) - offset;
    if(unit==='day') return ms(p.year,p.month-1,p.day);
    if(unit==='week') return ms(p.year,p.month-1,p.day-((p.dow+6)%7));
    if(unit==='month') return ms(p.year,p.month-1,1);
    if(unit==='quarter') return ms(p.year,(p.quarter-1)*3,1);
    if(unit==='year') return ms(p.year,0,1);
    return 0;
  };
  switch(F.range){
    case 'today': return [startOf('day'), now+1];
    case 'week': return [startOf('week'), now+1];
    case 'month': return [startOf('month'), now+1];
    case 'quarter': return [startOf('quarter'), now+1];
    case 'year': return [startOf('year'), now+1];
    case '30d': return [now-30*day, now+1];
    case '90d': return [now-90*day, now+1];
    case '365d': return [now-365*day, now+1];
    case 'custom': return [F.from?new Date(F.from+'T00:00').getTime():0, F.to?new Date(F.to+'T23:59:59').getTime():now+1];
    default: return [0, now+1];
  }
}

  });

  const hourG = mk([...Array(24).keys()], (f)=>f.hour, hl);
  const months = [...new Set(facts.map(f=>`${f.year}-${String(f.month).padStart(2,'0')}`))].sort();
  const monG = mk(months, (f)=>`${f.year}-${String(f.month).padStart(2,'0')}`, (k)=>{ const [y,m]=k.split('-'); return new Date(Date.UTC(+y,+m-1,15)).toLocaleString('en-US',{month:'short',timeZone:'UTC'})+" '"+y.slice(2); });

    const L = listed[r.key] || (f0.productId?listed['prod:'+f0.productId]:null);
    const start = L || firstSeen[r.key] || Math.min(...fs.map(f=>f.t));
    const last = Math.max(...fs.map(f=>f.t));
    const days = Math.max(1, (Math.max(last, now) - start)/86400000);
    const perWeek = r.units / days * 7;
    return { ...r, name: f0.name, band: bandOf(r.gross/r.units), from: start, basis: L?((f0.skuId && RU[f0.skuId])?'relisted':'listing'):'first sale', perWeek, daysFor10: perWeek ? 10/(perWeek/7) : null, consigned: fs.some(f=>f.consigned) };
  }).sort((a,b)=>b.perWeek-a.perWeek).slice(0,20);
  // consignment
  const cf = facts.filter(f=>f.consigned), of = facts.filter(f=>!f.consigned);
  const ct = total(cf), ot = total(of);
  const consBands = PRICE_BANDS.map(b=>{ const lab=bandLabel(b); const fs=cf.filter(f=>f.band===lab); if(!fs.length) return null;
    const a=total(fs); const d=fs.map(f=>{ const L=listed[f.key]||firstSeen[f.key]; return L?(f.t-L)/86400000:null; }).filter(x=>x!=null&&x>=0); return {lab, ...a, days:median(d)}; }).filter(Boolean);
  const consignees = aggregate(cf, (f)=>f.consignee||'Unnamed').sort((a,b)=>b.gross-a.gross);
  const liveT = total(facts.filter(f=>f.channel==='live')), offT = total(facts.filter(f=>f.channel==='offline'));
  const legend = split ? `<div class="legend"><span><i style="background:var(--s1)"></i>Live</span><span><i style="background:var(--s2)"></i>Offline</span></div>` : '';
  const topDow = dowG.map((g,i)=>({i, v:g.values.reduce((s,x)=>s+x.v,0)})).sort((a,b)=>b.v-a.v)[0];
  const topHour = hourG.map((g,i)=>({i, v:g.values.reduce((s,x)=>s+x.v,0)})).sort((a,b)=>b.v-a.v)[0];

  $('main').innerHTML = filtersHtml(false) + kpis(t) +
  (facts.length ? `
  <div class="grid3">
    <div class="card"><h2>🏆 Best day</h2><div class="kpi" style="border:none;padding:0"><div class="v">${topDow&&topDow.v?DOW[topDow.i]:'—'}</div><div class="s">${topDow?money0(topDow.v)+' gross in range':''}</div></div></div>
    <div class="card"><h2>⏰ Best hour</h2><div class="kpi" style="border:none;padding:0"><div class="v">${topHour&&topHour.v?hl(topHour.i)+'–'+hl((topHour.i+1)%24):'—'}</div><div class="s">${topHour?money0(topHour.v)+' gross':''} · ${esc(D.settings.timezone.replace('America/',''))} time</div></div></div>
    <div class="card"><h2>💎 Top-earning price range</h2><div class="kpi" style="border:none;padding:0"><div class="v">${bestBand?esc(bestBand.lab):'—'}</div><div class="s">${bestBand?money0(bestBand.gross)+' · '+int(bestBand.units)+' units · '+int(bestBand.items)+' items':''}</div></div></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Sales by day of week <span class="sub">gross</span></h2>${legend}${barChart(dowG)}</div>
    <div class="card"><h2>Sales by hour of day <span class="sub">gross · ${esc(D.settings.timezone.replace('America/',''))}</span></h2>${legend}${barChart(hourG.map(g=>({...g,label:g.label})))}</div>
  </div>
  <div class="card"><h2>When sales happen <span class="sub">day × hour, darker = less · hover for $</span></h2>
    <div class="heat"><span></span>${[...Array(24).keys()].map(h=>`<span style="text-align:center">${h%3===0?hl(h):''}</span>`).join('')}
    ${DOW.map((d,di)=>`<span class="lab">${d}</span>${[...Array(24).keys()].map(h=>{ const v=heat[di+':'+h]||0; return `<div class="c" style="background:${ramp(v)}" data-tip="${d} ${hl(h)} · ${money0(v)}"></div>`; }).join('')}`).join('')}</div></div>
  ${months.length>1?`<div class="card"><h2>Sales by month <span class="sub">gross</span></h2>${legend}${barChart(monG)}</div>`:''}
  <div class="grid2">
    <div class="card"><h2>Top spenders</h2><div class="scroll" style="max-height:420px"><table><thead><tr><th>#</th><th>Buyer</th><th class="n">Orders</th><th class="n">Units</th><th class="n">Spend</th></tr></thead><tbody>
      ${spenders.map((r,i)=>`<tr><td class="muted">${i+1}</td><td><b>${esc(r.name)}</b>${r.handle?` <span class="small muted">@${esc(r.handle)}</span>`:''}</td><td class="n">${int(r.orders)}</td><td class="n">${int(r.units)}</td><td class="n"><b>${money0(r.gross)}</b></td></tr>`).join('')}</tbody></table></div></div>
    <div class="card"><h2>Best sellers</h2><div class="scroll" style="max-height:420px"><table><thead><tr><th>Item</th><th class="n">Units</th><th class="n">Gross</th><th class="n">Margin</th></tr></thead><tbody>
      ${items.map(r=>`<tr><td>${esc(r.key)}</td><td class="n">${int(r.units)}</td><td class="n"><b>${money0(r.gross)}</b></td><td class="n">${pct(r.margin)}</td></tr>`).join('')}</tbody></table></div></div>
  </div>
  <div class="card"><h2>Price points <span class="sub">which price ranges sell most consistently</span></h2>
    <table><thead><tr><th>Price per unit</th><th class="n">Units</th><th class="n">Orders</th><th class="n">Distinct items</th><th class="n">Gross</th><th class="n">Net</th><th class="n">Margin</th><th class="n" title="Median days from the product being listed to each sale (needs a catalog sync)">Median days to sell</th></tr></thead><tbody>
    ${bandRows.map(r=>`<tr${bestBand&&r.lab===bestBand.lab?' style="background:#16233f"':''}><td><b>${esc(r.lab)}</b></td><td class="n">${int(r.units)}</td><td class="n">${int(r.orders)}</td><td class="n">${int(r.items)}</td><td class="n">${money0(r.gross)}</td><td class="n">${money0(r.net)}</td><td class="n">${pct(r.margin)}</td><td class="n">${r.daysToSell==null?'<span class="muted small">sync catalog</span>':Math.round(r.daysToSell)+'d'}</td></tr>`).join('')}</tbody></table></div>
  <div class="card"><h2>Time to sell <span class="sub">fastest movers · velocity from ${D.catalog.products&&D.catalog.products.length?'listing date':'first sale'} to now</span></h2>
    <div class="scroll" style="max-height:460px"><table><thead><tr><th>Item</th><th>Price band</th><th class="n">Units sold</th><th class="n">Units / week</th><th class="n">Days to move 10</th><th>Measured from</th></tr></thead><tbody>
    ${tts.map(r=>`<tr><td>${esc(r.name)} ${r.consigned?'<span class="pill cons">CONSIGNED</span>':''}</td><td>${esc(r.band)}</td><td class="n">${int(r.units)}</td><td class="n">${(Math.round(r.perWeek*10)/10)}</td><td class="n">${r.daysFor10?Math.round(r.daysFor10)+'d':'—'}</td><td class="small muted">${esc(r.basis)} ${esc(fmtD(r.from))}</td></tr>`).join('')}</tbody></table></div>
    <p class="small muted">Once the Product permission is added, daily stock snapshots make these exact (listing date, restocks and sell-through) instead of estimated from sales.</p></div>
  <div class="card"><h2>Consignment <span class="sub">profitability and time to sell</span></h2>
    <div class="grid3" style="margin-bottom:10px">
      <div class="kpi"><div class="l">Consigned gross</div><div class="v">${money0(ct.gross)}</div><div class="s">${int(ct.units)} units · ${t.gross?pct(ct.gross/t.gross*100):'0%'} of sales</div></div>
      <div class="kpi"><div class="l">Paid to consignees</div><div class="v">${money0(ct.payout)}</div></div>
      <div class="kpi"><div class="l">Net to us · margin</div><div class="v">${money0(ct.net)}</div><div class="s">consigned ${pct(ct.margin)} vs own stock ${pct(ot.margin)}</div></div>
    </div>
    ${consignees.length?`<div class="grid2"><div><table><thead><tr><th>Consignee</th><th class="n">Units</th><th class="n">Gross</th><th class="n">Payout</th><th class="n">Net</th></tr></thead><tbody>${consignees.map(c=>`<tr><td>${esc(c.key)}</td><td class="n">${int(c.units)}</td><td class="n">${money0(c.gross)}</td><td class="n">${money0(c.payout)}</td><td class="n">${money0(c.net)}</td></tr>`).join('')}</tbody></table></div>
      <div><table><thead><tr><th>Consigned price band</th><th class="n">Units</th><th class="n">Net</th><th class="n">Median days to sell</th></tr></thead><tbody>${consBands.map(b=>`<tr><td>${esc(b.lab)}</td><td class="n">${int(b.units)}</td><td class="n">${money0(b.net)}</td><td class="n">${b.days==null?'—':Math.round(b.days)+'d'}</td></tr>`).join('')}</tbody></table></div></div>`
      :'<p class="muted small">No consigned sales in this range. Mark items as consigned in Inventory & pricing.</p>'}
  </div>
  <div class="card"><h2>TikTok actuals <span class="sub">real settlements, fees, shipping and refunds from TikTok vs our estimates · ${int(A.settled)} of ${int(A.orders)} orders settled</span></h2>
    ${A.settled ? `<div class="grid4" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
      <div class="kpi"><div class="l">Actual settlement</div><div class="v">${money0(A.settlement)}</div><div class="s">estimate ${money0(A.estSettlement)} · <span style="color:${A.settlementDiff>=0?'var(--good,#3ecf8e)':'var(--bad)'}">${A.settlementDiff>=0?'+':''}${money0(A.settlementDiff)}</span></div></div>
      <div class="kpi"><div class="l">TikTok fees</div><div class="v">${pct(A.feePct)}</div><div class="s">${money0(A.fees)} actual · setting ${pct(A.estFeePct)}</div></div>
      <div class="kpi"><div class="l">Shipping per order</div><div class="v">${money(A.shipPerOrder)}</div><div class="s">${money0(A.shippingCost)} actual · estimate ${money(A.estShipPerOrder)}</div></div>
      <div class="kpi"><div class="l">Actual net</div><div class="v">${money0(A.netActual)}</div><div class="s">settled orders, after commission, cost & consignees</div></div>
    </div>` : '<p class="muted small">No settled orders in this range yet — TikTok settles orders about a week after delivery. Hit “Sync settlements & refunds” in ⚙ Settings to pull the latest.</p>'}
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px">
      <div class="kpi"><div class="l">Refund requests</div><div class="v">${pct(A.returnReqRate)}</div><div class="s">${int(A.returnReq)} of ${int(A.orders)} orders</div></div>
      <div class="kpi"><div class="l">Refunded</div><div class="v">${pct(A.refundRate)}</div><div class="s">${int(A.refunded)} orders · ${money0(A.refundAmt)}</div></div>
      <div class="kpi"><div class="l">Disputes</div><div class="v">${pct(A.disputeRate)}</div><div class="s">${int(A.disputes)} went to TikTok · ${int(A.disputesWon)} decided for LTs</div></div>
      <div class="kpi"><div class="l">Cancellations</div><div class="v">${pct(A.cancelRate)}</div><div class="s">buyer ${int(A.cancelBuyer)} · seller ${int(A.cancelSeller)} · system ${int(A.cancelSystem)}</div></div>
    </div>
    ${A.reasons.length?`<p class="small muted" style="margin-top:10px">Top refund reasons: ${A.reasons.map(r=>`${esc(r.reason)} (${r.n})`).join(' · ')}</p>`:''}
    ${A.pending?`<p class="small muted" style="margin-top:6px">${int(A.pending)} orders not settled yet (estimated ${money0(A.pendingEst)}).</p>`:''}
  </div>
  <div class="card"><h2>Live vs offline</h2>
    <div class="grid2"><div class="kpi"><div class="l"><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--s1);margin-right:5px"></i>Live</div><div class="v">${money0(liveT.gross)}</div><div class="s">${int(liveT.orders)} orders · avg ${money(liveT.aov)} · ${t.gross?pct(liveT.gross/t.gross*100):'0%'}</div></div>
    <div class="kpi"><div class="l"><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--s2);margin-right:5px"></i>Offline</div><div class="v">${money0(offT.gross)}</div><div class="s">${int(offT.orders)} orders · avg ${money(offT.aov)} · ${t.gross?pct(offT.gross/t.gross*100):'0%'}</div></div></div></div>`
  : `<div class="card muted">No sales in this range yet. ${ORDERS.length?'Try a wider range.':'Sales appear here as orders come in — or import past TikTok orders from ⚙ Settings to see history right away.'}</div>`);
  wireFilters();
}

// ───────────────────────── changelog ─────────────────────────
let logQ = '';
function renderLog(){
  const q = logQ.toLowerCase();
  const rows = (D.changelog||[]).filter(c=>!q || JSON.stringify(c).toLowerCase().includes(q));
  const v = (x)=> x==null||x==='' ? '<span class="muted">—</span>' : esc(typeof x==='number' ? (Number.isInteger(x)?x:x.toFixed(2)) : x);
  $('main').innerHTML = `<div class="card"><h2>Changelog <span class="sub">every cost, consignment, price, stock and setting change — newest first</span></h2>
    <div class="row" style="margin-bottom:10px"><input id="lq" placeholder="Search…" value="${esc(logQ)}" style="flex:1"><a href="/api/bo/changelog.csv"><button>⬇ CSV</button></a></div>
    <div class="scroll"><table><thead><tr><th>When</th><th>What</th><th>Item / setting</th><th>Field</th><th class="n">From</th><th class="n">To</th><th>Result</th></tr></thead><tbody>
    ${rows.map(c=>`<tr><td class="small">${esc(fmtD(c.ts,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}))}</td><td>${esc(c.kind)}</td><td>${esc(c.label)}</td><td>${esc(c.field)}</td><td class="n">${v(c.from)}</td><td class="n">${v(c.to)}</td><td class="small ${c.result&&c.result!=='ok'?'':'muted'}" style="${c.result&&c.result!=='ok'?'color:var(--bad)':''}">${esc(c.result||'saved')}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">No changes yet.</td></tr>'}
    </tbody></table></div></div>`;
  $('lq').oninput = (e)=>{ logQ=e.target.value; const p=e.target.selectionStart; renderLog(); $('lq').focus(); $('lq').setSelectionRange(p,p); };
}

// ───────────────────────── settings ─────────────────────────
function renderSettings(){
  const s = D.settings, li = D.lastImport;
  $('main').innerHTML = `<div class="grid2">
  <div class="card"><h2>Fees & estimates</h2>
    <p class="small muted" style="margin-top:0">Used for every net-revenue / profit figure (reports, exports, metrics). Changes apply to all reports immediately and are logged.</p>
    <label class="small muted">TikTok fee (% of sale)</label><div class="row"><input id="sf" type="number" step="0.1" min="0" value="${s.tiktokFeePct}" style="width:120px"> %</div>
    <label class="small muted" style="display:block;margin-top:10px">Streamer commission (% of sale)</label><div class="row"><input id="sc" type="number" step="0.1" min="0" value="${s.streamerPct}" style="width:120px"> %</div>
    <label class="small muted" style="display:block;margin-top:10px">Shipping estimate</label>
    <div class="row"><select id="sm" style="width:auto"><option value="fixed" ${s.shippingMode!=='pct'?'selected':''}>Fixed $ per order</option><option value="pct" ${s.shippingMode==='pct'?'selected':''}>% of the order</option></select>
      <span id="smf" style="display:${s.shippingMode!=='pct'?'inline-flex':'none'};gap:6px;align-items:center">$ <input id="sfx" type="number" step="0.01" min="0" value="${s.shippingFixed}" style="width:100px"> per order</span>
      <span id="smp" style="display:${s.shippingMode==='pct'?'inline-flex':'none'};gap:6px;align-items:center"><input id="spc" type="number" step="0.1" min="0" value="${s.shippingPct}" style="width:100px"> % of order</span></div>
    <p class="small muted">Shipping is an <b>estimate</b> — shown as such on every report.</p>
    <label class="small muted" style="display:block;margin-top:10px">Report time zone</label>
    <select id="stz">${['America/New_York','America/Chicago','America/Denver','America/Phoenix','America/Los_Angeles'].map(z=>`<option ${s.timezone===z?'selected':''}>${z}</option>`).join('')}</select>
    <div class="row" style="margin-top:14px"><button class="primary" id="ssave">Save settings</button><span id="smsg" class="small muted"></span></div></div>
  <div>
  <div class="card"><h2>Import past TikTok orders</h2>
    <p class="small muted" style="margin-top:0">Pulls every order from TikTok for the period you pick into the sales history, so metrics and exports cover more than what the queue has seen. Safe to run again — nothing is duplicated. Orders that fall inside a recorded stream count as live; others as offline.</p>
    <div class="row"><select id="idays" style="width:auto"><option value="30">Last 30 days</option><option value="90" selected>Last 90 days</option><option value="180">Last 6 months</option><option value="365">Last 12 months</option></select><button id="igo">⬇ Import</button></div>
    <p class="small" id="imsg">${li ? (li.error?`<span style="color:var(--bad)">Last import failed: ${esc(li.error)}</span>`:`Last import ${esc(fmtD(li.at,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))}: ${int(li.added)} orders added${li.linked?`, ${int(li.linked)} older lines linked to inventory`:''} (last ${li.days} days).`) : '<span class="muted">Not run yet.</span>'}</p></div>
  <div class="card"><h2>TikTok actuals</h2>
    <p class="small muted" style="margin-top:0">Pulls TikTok's real settlement for each order (revenue, fees, shipping label cost, refunds) plus every refund/return request and cancellation. Runs on its own every 4 hours; read-only.</p>
    <div class="row"><button id="fgo">↻ Sync settlements &amp; refunds</button></div>
    <p class="small" id="fmsg">${D.lastFinance ? `Last sync ${esc(fmtD(D.lastFinance.at,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))}: ${int(D.lastFinance.checked)} orders checked, ${int(D.lastFinance.settled)} settled · ${int(D.lastFinance.returns)} refund requests, ${int(D.lastFinance.cancellations)} cancellations${D.lastFinance.error?` · <span style="color:var(--bad)">${esc(D.lastFinance.error)}</span>`:''}` : '<span class="muted">Not run yet — the first sync checks every order (a few minutes).</span>'}</p></div>
  <div class="card"><h2>TikTok permissions</h2>
    <p class="small muted" style="margin-top:0">Checks which API permissions the LTs shop granted this app, and proves each with a harmless read. Changes nothing.</p>
    <button id="permgo">Check TikTok permissions</button><div id="permout" class="small" style="margin-top:10px"></div></div>
  <div class="card"><h2>Back-office password</h2>
    ${D.password==='env' ? '<p class="small muted">Set in Render as <code>BACKOFFICE_PASSWORD</code> — change it there.</p>' :
    `<input type="password" id="pc" placeholder="Current password" style="width:100%;margin-bottom:6px"><input type="password" id="pn" placeholder="New password (8+ characters)" style="width:100%;margin-bottom:8px">
     <div class="row"><button id="pgo">Change password</button><span class="small muted" id="pmsg"></span></div>
     <p class="small muted">Changing it signs everyone else out of the back office.</p>`}</div>
  </div></div>`;
  $('sm').onchange = ()=>{ const p=$('sm').value==='pct'; $('smf').style.display=p?'none':'inline-flex'; $('smp').style.display=p?'inline-flex':'none'; };
  $('ssave').onclick = async ()=>{
    const r = await api('/api/bo/settings', { tiktokFeePct:+$('sf').value, streamerPct:+$('sc').value, shippingMode:$('sm').value, shippingFixed:+$('sfx').value, shippingPct:+$('spc').value, timezone:$('stz').value });
    $('smsg').textContent = r.ok ? (r.changed ? 'Saved ✓' : 'No changes') : (r.error||'Failed');
    if(r.ok) D.settings = r.settings;
  };
  $('fgo').onclick = async ()=>{
    const r = await api('/api/bo/finance-sync', { all: !D.lastFinance });
    if(!r.ok){ $('fmsg').textContent = r.error || 'Could not start'; return; }
    $('fmsg').textContent = 'Syncing…';
    const poll = setInterval(async ()=>{
      const p = await api('/api/bo/finance-sync');
      if(p.running){ $('fmsg').textContent = `Syncing… ${int(p.running.done)} / ${int(p.running.total||0)} orders · ${int(p.running.settled)} settled`; return; }
      clearInterval(poll); await reloadData();
    }, 3000);
  };
  $('igo').onclick = async ()=>{
    const r = await api('/api/bo/import', {days: +$('idays').value});
    if(!r.ok){ $('imsg').textContent = r.error || 'Could not start'; return; }
    $('imsg').textContent = 'Importing…';
    const poll = setInterval(async ()=>{
      const p = await api('/api/bo/import');
      if(p.running){ $('imsg').textContent = `Importing… ${int(p.running.done)} / ${int(p.running.total||0)} orders`; return; }
      clearInterval(poll);
      await reloadData();
    }, 2000);
  };
  $('permgo').onclick = async ()=>{
    $('permout').textContent = 'Checking…';
    const r = await fetch('/api/tiktok-permissions?refresh=1').then(x=>x.json()).catch(e=>({ok:false,error:e.message}));
    if(!r.ok){ $('permout').innerHTML = `<span style="color:var(--bad)">${esc(r.error||'Check failed')}</span>`; return; }
    const mark = (g)=> g===true ? '<span style="color:var(--good)">✓ yes</span>' : g===false ? '<span style="color:var(--bad)">✗ missing</span>' : '<span class="muted">unknown</span>';
    $('permout').innerHTML = `<table><tbody>${r.features.map(f=>`<tr><td>${esc(f.feature)}${f.needed?'':' <span class="muted">(optional)</span>'}</td><td class="n">${mark(f.granted)}</td></tr>`).join('')}</tbody></table>`
      + `<p class="muted">Shop: ${esc(r.shop)} · ${r.grantedScopes?r.grantedScopes.length+' permissions granted':'TikTok did not report the permission list'}</p>`
      + (r.grantedScopes?`<details><summary class="muted">Raw permission list</summary><code>${r.grantedScopes.map(esc).join(', ')}</code></details>`:'');
  };
  if($('pgo')) $('pgo').onclick = async ()=>{
    const r = await api('/api/bo/password', {current:$('pc').value, next:$('pn').value});
    $('pmsg').textContent = r.ok ? 'Password changed ✓' : (r.error||'Failed');
  };
}

// tooltips
const tip = $('tip');
document.addEventListener('mousemove', (e)=>{
  const b = e.target.closest && e.target.closest('[data-tip]');
  if(!b){ tip.style.display='none'; return; }
  tip.textContent = b.getAttribute('data-tip'); tip.style.display='block';
  tip.style.left = Math.min(window.innerWidth-220, e.clientX+12)+'px'; tip.style.top = (e.clientY-34)+'px';
});
boot();
</script>
</body>
</html>
